<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Julio - Meu Painel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #3182ce, #5aa9e6);
      min-height: 100vh;
      color: #333;
    }

    .top {
      height: 230px;
      background: linear-gradient(135deg, #277bc4, #63b3ed);
      border-radius: 0 0 80px 20px;
    }

    .profile {
      text-align: center;
      margin-top: -80px;
    }

    .avatar {
      width: 145px;
      height: 145px;
      margin: auto;
      border-radius: 50%;
      background: #c99429;
      border: 8px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 100px;
      line-height: 1;
    }

    .name {
      font-size: 38px;
      margin-top: 25px;
      color: #333;
    }

    .id {
      font-size: 17px;
      color: #777;
      margin-top: 5px;
    }

    .card {
      width: 90%;
      max-width: 620px;
      margin: 35px auto 100px;
      background: white;
      border-radius: 28px;
      padding: 30px 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .balances {
      display: flex;
      justify-content: space-around;
      text-align: center;
      gap: 20px;
    }

    .balance-title {
      font-size: 18px;
      color: #555;
    }

    .balance {
      color: #07558b;
      font-size: 32px;
      font-weight: bold;
      margin-top: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-top: 35px;
    }

    .button {
      border: none;
      background: white;
      cursor: pointer;
      text-align: center;
      font-size: 17px;
      color: #555;
    }

    .icon {
      width: 92px;
      height: 92px;
      margin: auto auto 10px;
      background: #edf5fc;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .button:active .icon {
      transform: scale(.95);
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 82px;
      background: linear-gradient(90deg, #254b91, #a5224b, #df1825);
      display: flex;
      justify-content: space-around;
      align-items: center;
      color: white;
    }

    .nav {
      text-align: center;
      font-size: 14px;
      cursor: pointer;
    }

    .nav-icon {
      font-size: 28px;
      display: block;
      margin-bottom: 3px;
    }

    @media (max-width: 450px) {
      .balance {
        font-size: 25px;
      }

      .balance-title {
        font-size: 16px;
      }

      .name {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="top"></div>

  <div class="profile">

    <div class="avatar">I</div>

    <div class="name">Julio</div>

    <div class="id">ID 08*******49</div>

  </div>

  <div class="card">

    <div class="balances">

      <div>
        <div class="balance-title">Saldo de recarga</div>
        <div class="balance">MZN 0.00</div>
      </div>

      <div>
        <div class="balance-title">Saldo de saque</div>
        <div class="balance">MZN 0.00</div>
      </div>

    </div>

    <div class="buttons">

      <button class="button" onclick="alert('Área de recarga')">
        <div class="icon">↪</div>
        Recarregar
      </button>

      <button class="button" onclick="alert('Área de saque')">
        <div class="icon">↥</div>
        Sacar
      </button>

      <button class="button" onclick="alert('Área de pedidos')">
        <div class="icon">☷</div>
        Pedidos
      </button>

      <button class="button" onclick="alert('Área da carteira')">
        <div class="icon">▤</div>
        Carteira
      </button>

    </div>

  </div>

  <div class="bottom">

    <div class="nav" onclick="alert('Início')">
      <span class="nav-icon">⌂</span>
      Início
    </div>

    <div class="nav" onclick="alert('Investir')">
      <span class="nav-icon">◇</span>
      Investir
    </div>

    <div class="nav" onclick="alert('Avisos')">
      <span class="nav-icon">□</span>
      Avisos
    </div>

    <div class="nav" onclick="alert('Meu perfil')">
      <span class="nav-icon">●</span>
      Meu
    </div>

  </div>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const recarregar = [...document.querySelectorAll("*")].find(el =>
    el.children.length === 0 &&
    el.textContent.trim() === "Recarregar"
  );

  if (!recarregar) return;

  recarregar.style.cursor = "pointer";

  recarregar.addEventListener("click", function () {

    const valor = prompt("Digite o valor que deseja recarregar (MZN):");

    if (valor === null) return;

    const numero = parseFloat(valor.replace(",", "."));

    if (isNaN(numero) || numero <= 0) {
      alert("Digite um valor válido.");
      return;
    }

    alert(
      "Pedido de recarga criado!\n\n" +
      "Valor: MZN " + numero.toFixed(2)
    );

  });

});
</script>
</body>
</html>
