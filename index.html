<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julio - Meu Painel</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.header{height:210px;background:linear-gradient(135deg,#1762a8,#75b7e8);
border-radius:0 0 80px 20px}
.container{max-width:700px;margin:auto;padding:0 18px}
.profile{text-align:center;margin-top:-75px}
.avatar{width:145px;height:145px;margin:auto;border-radius:50%;
background:#c99429;border:8px solid #f5f5f5;color:white;
font-size:100px;line-height:125px}
.name{font-size:30px;margin:8px}
.id{color:#666}
.card{background:white;border-radius:18px;padding:20px;margin:15px 0;
box-shadow:0 2px 10px #0001}
.balances{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.balance span{color:#555}
.balance strong{display:block;color:#124d82;font-size:24px;margin-top:7px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.action{border:0;background:white;color:#555}
.icon{width:48px;height:48px;margin:auto auto 7px;border-radius:13px;
background:#eaf3fb;display:flex;align-items:center;justify-content:center;
font-size:22px}
.vip{background:linear-gradient(120deg,#194b82,#c72525);color:white}
.progress{height:18px;background:#eee;border-radius:20px;overflow:hidden}
.bar{width:55%;height:100%;background:#ffd477}
.menu{position:fixed;bottom:0;left:0;right:0;
background:linear-gradient(90deg,#164d86,#c72b2b);
display:grid;grid-template-columns:repeat(4,1fr);padding:9px;color:white}
.menu button{background:none;border:0;color:white;font-size:13px}
.menu b{display:block;font-size:22px}
.bottom{height:70px}

@media(max-width:420px){
.actions{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="header"></div>

<div class="container">

<div class="profile">
<div class="avatar">I</div>
<div class="name">Julio</div>
<div class="id">ID 08******49</div>
</div>

<div class="card">

<div class="balances">
<div class="balance">
<span>Saldo de recarga</span>
<strong>MZN 0.00</strong>
</div>

<div class="balance">
<span>Saldo de saque</span>
<strong>MZN 0.00</strong>
</div>
</div>

<div class="actions">

<button class="action"><div class="icon">↪</div>Recarregar</button>
<button class="action"><div class="icon">↥</div>Sacar</button>
<button class="action"><div class="icon">☷</div>Pedidos</button>
<button class="action"><div class="icon">▤</div>Carteira</button>

</div>
</div>

<div class="card vip">
<h2>👑 Nível VIP — VIP 2</h2>
<p>Atualizar para <b>VIP3</b>, ainda faltam <b>2900</b></p>
<div class="progress"><div class="bar"></div></div>
</div>

<div class="card">
<h2>Minha empresa</h2>

<div class="actions">
<button class="action"><div class="icon">♧</div>Equipe</button>
<button class="action"><div class="icon">＄</div>Investir</button>
<button class="action"><div class="icon">🎁</div>Bónus</button>
<button class="action"><div class="icon">🔔</div>Avisos</button>
</div>
</div>

<div class="bottom"></div>
</div>

<div class="menu">
<button><b>⌂</b>Início</button>
<button><b>◈</b>Investir</button>
<button><b>▣</b>Avisos</button>
<button><b>●</b>Meu</button>
</div>

</body>
  </html>
